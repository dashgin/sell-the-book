{% extends "account/base.html" %}

{% load i18n %}

{% block head_title %}Çıxış{% endblock %}

{% block content %}
<h1 class="text-center">Çıxış</h1>

<p class="text-danger text-center">Çıxış edirsiniz</p>

<form class="text-center" method="post" action="{% url 'account_logout' %}">
  {% csrf_token %}
  {% if redirect_field_value %}
  <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
  {% endif %}
  <button class="btn btn-primary" type="submit">Çıxış</button>
</form>


{% endblock %}

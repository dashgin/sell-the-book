{% extends "partials/_base.html" %}

{% load static %}
{% block content %}

    <section>
        <div class="container">
            <div class="row">
                <form method="post" enctype="multipart/form-data" class="form-control w-50 mx-auto my-5">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-outline-primary">Update</button>
                </form>
            </div>
        </div>
    </section>

{% endblock %}

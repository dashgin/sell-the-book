{% load humanize %}
{% for book in products %}
    <div class="col-6 col-md-4 col-lg-3 mx-auto my-3">
        <div class="card">
            <div class="card-header bg-transparent p-0">
                <img class="card-img-top" src="{{ book.image.url }}" alt="Card image cap"
                     height="150px">
            </div>
            <div class="card-body position-relative py-2 px-2">
                <span class="text -white h5"><strong>{{ book.price }} AZN</strong></span>
                {#<span class="text-danger fs-4 position-absolute top-0 end-0 me-1 heart"><i class="far fa-heart p-1"></i></span>#}
                <h6 class="mt-2 mb-1 card-text">
                    <a href="{% url 'product-detail' book.slug %}" class="text-dark">
                        {{ book.title | truncatechars:25 }}
                    </a>
                </h6>
                <span>{{ book.author }}</span>
            </div>
            <div class="card-footer py-0 px-2">
                <small class="text-success float-start">{{ book.created_at|naturaltime }}</small>
                {#<small class="float-end">{{ book.total_hit_count }} <i class="fas fa-eye"></i></small> #}
            </div>
        </div>
    </div>

{% endfor %}
